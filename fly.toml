app = "pita-idx"
primary_region = "sin"

[build]

[env]
  JOURNAL_FILE = "/data/journal.json"

[[mounts]]
  source = "pita_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
